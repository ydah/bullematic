name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        gemfile:
          - gemfiles/rails_7.0.gemfile
          - gemfiles/rails_7.1.gemfile
          - gemfiles/rails_7.2.gemfile
          - gemfiles/rails_8.0.gemfile
          - gemfiles/rails_8.1.gemfile
        exclude:
          - ruby: '3.1'
            gemfile: gemfiles/rails_8.0.gemfile
          - ruby: '3.1'
            gemfile: gemfiles/rails_8.1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run unit tests
        run: bundle exec rspec spec/bullematic

      - name: Run integration tests
        run: bundle exec rspec spec/integration

      - name: Run Minitest
        run: bundle exec rake test

  coverage:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests with coverage
        run: COVERAGE=1 bundle exec rspec

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage.xml

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run type checks
        run: bundle exec rake typecheck

      - name: Build packaged gem
        run: gem build bullematic.gemspec --output /tmp/bullematic.gem

      - name: Install packaged gem
        run: gem install --local /tmp/bullematic.gem --ignore-dependencies

      - name: Smoke test packaged executable
        run: bullematic doctor

  bullet-compatibility:
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/bullet_6.gemfile

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run full suite with Bullet 6
        run: bundle exec rake

  prism-minimum:
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/prism_0.24.gemfile

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Run AST and integration tests with minimum Prism
        run: bundle exec rspec spec/bullematic/ast spec/integration/n_plus_one_fix_spec.rb

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run unit tests on Windows
        run: bundle exec rspec spec/bullematic
